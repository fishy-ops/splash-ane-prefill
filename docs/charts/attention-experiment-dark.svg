<svg xmlns="http://www.w3.org/2000/svg" width="720" height="130" viewBox="0 0 720 130" role="img" aria-label="Two-page attention experiment, percent slower per context" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Two-page attention experiment, percent slower per context</title>
<text x="80.0" y="20.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">2K context</text>
<rect x="90.0" y="4.0" width="347.7" height="22" rx="2" fill="#db6d28"/>
<text x="445.7" y="20.0" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start">+24%  (0.135 to 0.167 ms)</text>
<text x="80.0" y="50.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">8K context</text>
<rect x="90.0" y="34.0" width="176.9" height="22" rx="2" fill="#db6d28"/>
<text x="274.9" y="50.0" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start">+12%  (0.373 to 0.418 ms)</text>
<text x="80.0" y="80.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">32K context</text>
<rect x="90.0" y="64.0" width="44.7" height="22" rx="2" fill="#db6d28"/>
<text x="142.7" y="80.0" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start">+3%  (1.148 to 1.183 ms)</text>
<text x="80.0" y="110.0" fill="#9198a1" font-size="12" font-weight="400" text-anchor="end">64K context</text>
<rect x="90.0" y="94.0" width="134.7" height="22" rx="2" fill="#db6d28"/>
<text x="232.7" y="110.0" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start">+9%  (2.264 to 2.472 ms)</text>
<line x1="90.0" y1="0.0" x2="90.0" y2="124.0" stroke="#3d444d"/>
</svg>
